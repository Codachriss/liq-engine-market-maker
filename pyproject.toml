[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liq-engine"
version = "0.0.1"
description = "Autonomous on-chain liquidation and opportunity system (personal capital)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "certifi>=2024.2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "eth-utils>=4.1",
    "eth-hash[pycryptodome]>=0.7",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "hypothesis>=6.100",
]
research = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "jupyterlab>=4.2",
]

[project.scripts]
liq = "liqengine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/liqengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/liqengine"]
