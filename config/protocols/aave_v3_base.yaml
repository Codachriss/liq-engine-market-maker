    queryable_premium: true

# Verified against Base: code present at the quoter, and WETH->USDC fills on the 5bps tier
# (the first address recorded here was mistyped in its last four characters and had no code,
# which `UniswapV3Quoter.verify` now catches rather than reporting every pair as unroutable).
# The quoter, not the router — quoting is a read; swapping is the execution path's problem.
# Single-hop only for now: multi-hop needs a packed `bytes` path, which core.abi.encode_call
# deliberately refuses to encode. Long-tail collateral without a direct debt pair is therefore
# unquotable here and, by D18, unexecutable — which is the correct failure, not a silent one.
exit_venues:
  - name: uniswap_v3
    kind: uniswap_v3_quoter_v2
    quoter: "0x3d4e44Eb1374240CE5F1B871ab261CD16335B76a"
    fee_tiers: [100, 500, 3000, 10000]

asset_annotations:
  - { address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913", symbol: USDC,   is_stable: true, oracle_kind: chainlink_push }
  - { address: "0xd9aAEc86B65D86f6A7B5B1b0c42FFA531710b6CA", symbol: USDbC,  is_stable: true, oracle_kind: chainlink_push }
  - { address: "0x4200000000000000000000000000000000000006", symbol: WETH,   oracle_kind: chainlink_push }
  - { address: "0xc1CBa3fCea344f92D9239c08C0568f6F2F0ee452", symbol: wstETH, oracle_kind: capped_adapter, thin_exit_liquidity: false }
  - { address: "0x2Ae3F1Ec7F1F5012CFEab0185bfc7aa3cf0DEc22", symbol: cbETH,  oracle_kind: capped_adapter, thin_exit_liquidity: true }

refresh:
